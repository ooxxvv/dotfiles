# Rime schema
# encoding: utf-8
schema:
  name: bô-siánn-mih
  schema_id: bosiannmih
  version: 1
  author: "劉重次 / 泰瑞系列中文輸入法對照表 / ooxxvv "
  description: bô-siánn-mih (嘸蝦米)

# 預設模式為英文
switches:
  - name: ascii_mode
    reset: 1

engine:
  processors:
    - ascii_composer
    - recognizer
    - key_binder
    - speller
    - selector
    - express_editor
  segmentors:
    - ascii_segmentor
    - abc_segmentor
  translators:
    - table_translator
  filters:
    - uniquifier

# 設定某些格式的文字不要自動組字，減少打字的中斷次數。
# (可以用 Email 來測試沒有 recognizer/patterns 的情況)
recognizer:
  patterns:
    email: "^[A-Za-z][-_.0-9A-Za-z]*@.*$"
    url: "^(www[.]|https?:|ftp[.:]|mailto:|file:).*$|^[a-z]+[.].+$"

# 小於五碼的英文字，用空白鍵會輸出中文，用 Enter 會輸出英文。
# 例如：we+空白鍵會輸出「武」，we+Enter 會輸出「we」
#       We+空白鍵會輸出「We」，We+Enter 也會輸出「We」
speller:
  alphabet: "abcdefghijklmnopqrstuvwxyz.,'[]"
  max_code_length: 5
  auto_select: false
  use_space: true

translator:
  dictionary: bosiannmih
  # 如果要所有的字(也就是不包含在預設字型裡的字)都出現在選字視窗，可以把 enable_charset_filter 改成 false
  enable_charset_filter: true
  enable_encoder: false
  enable_commit_history: true
  enable_completion: false
  enable_sentence: false
  enable_user_dict: false
  
key_binder:
  bindings:
    # 使用左右鍵選字
    - { accept: Left, send: Up, when: composing }
    - { accept: Right, send: Down, when: composing }
    
 